# HiveOS custom-miner manifest. Sourced by the agent and by h-run.sh/h-config.sh.
# shellcheck shell=bash disable=SC2034
CUSTOM_NAME=dirtybird-rust-miner
CUSTOM_CONFIG_FILENAME=/hive/miners/custom/${CUSTOM_NAME}/${CUSTOM_NAME}.conf
CUSTOM_LOG_BASEDIR=/var/log/miner/${CUSTOM_NAME}
CUSTOM_LOG_BASENAME=${CUSTOM_LOG_BASEDIR}/miner
# Localhost stats endpoint the miner is launched with (h-config.sh appends the
# flag; h-stats.sh and mmp-stats.sh poll it).
MINER_API_PORT=44011
