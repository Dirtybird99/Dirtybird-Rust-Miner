[package]
name = "dero-astrobwt"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "AstroBWTv3 proof-of-work hash (DERO HE STARGATE) — port of astrobwt/astrobwtv3."

[features]
# Pure-Rust sais32 stays the DEFAULT so wasm / no-C-toolchain builds are untouched.
default = []
# Opt-in: route AstroBWTv3's suffix-array step through the C library libsais.
# Kept ONLY as a differential-fuzz/benchmark oracle now — the production `v114`
# path no longer uses it (its refusal fallback is the pure-Rust sais32).
libsais = ["dep:libsais-sys"]
# Production mining backend: the Dirtybird v1.14 descriptor suffix array, in pure
# Rust (src/v114.rs). Refused inputs fall back to the pure-Rust sais32. Needs NO
# C toolchain at all (no clang-cl, no cc/libsais).
v114 = []
# Dev/verification only: ALSO compile the vendored C++ descriptor SA
# (vendor/v114) AND libsais, so the Rust SA can be differentially fuzzed against
# both (DERO_V114_CPP=1 selects the C++ at runtime). Requires clang-cl on PATH.
v114-cpp = ["v114", "libsais"]
# Opt-in: per-stage rdtsc instrumentation (measurement only). Adds a separate
# profiled pipeline; the production hot path is untouched.
profiling = []

[dependencies]
# Safe `&[u32] -> &[u8]` reinterpretation for the fused SHA sink, so the
# streaming hash path needs no `unsafe` (see src/v114.rs).
bytemuck = "1"
sha2 = "0.10"
sha3.workspace = true
salsa20 = "0.10"
xxhash-rust = { version = "0.8", features = ["xxh64"] }
siphasher = "1"
num-bigint = { workspace = true }
num-traits = { workspace = true }
# default-features = false drops the crate's default `openmp` feature (and the
# openmp-sys system dependency): the miner already parallelizes across nonces.
libsais-sys = { version = "0.2", default-features = false, optional = true }

[build-dependencies]
cc = "1"

[dev-dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
hex = { workspace = true }
sha3.workspace = true
salsa20 = "0.10"
