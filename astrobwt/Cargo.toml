[package]
name = "dero-astrobwt"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "AstroBWTv3 proof-of-work hash (DERO HE STARGATE) — port of astrobwt/astrobwtv3."

[features]
# Pure-Rust sais32 stays the DEFAULT so wasm / no-C-toolchain builds are untouched.
default = []
# Opt-in: route AstroBWTv3's suffix-array step through the C library libsais.
# Kept ONLY as a differential-fuzz/benchmark oracle now — the production `v114`
# path no longer uses it (its refusal fallback is the pure-Rust sais32).
libsais = ["dep:libsais-sys"]
# Production mining backend: the Dirtybird v1.14 descriptor suffix array, in pure
# Rust (src/v114.rs). Refused inputs fall back to the pure-Rust sais32. Needs no
# C toolchain for the SA itself (no clang-cl, no cc/libsais) on any target. One
# unrelated exception applies to aarch64 ONLY: the sha2 `asm` dependency below
# builds a (never-called) .S through cc, so arm64 builds do need a C compiler
# for the target -- x86/Windows builds remain C-free end to end.
v114 = []
# Dev/verification only: ALSO compile the vendored C++ descriptor SA
# (vendor/v114) AND libsais, so the Rust SA can be differentially fuzzed against
# both (DERO_V114_CPP=1 selects the C++ at runtime). Requires clang-cl on PATH.
v114-cpp = ["v114", "libsais"]
# Opt-in: per-stage rdtsc instrumentation (measurement only). Adds a separate
# profiled pipeline; the production hot path is untouched.
profiling = []
# Experimental two-stream SHA-256 using x86_64 SHA-NI.
shani2 = []
# Opt-in AVX2 acceleration for the step-5 byte op loop. Runtime use additionally
# requires the AVX2OPS environment variable and AVX2 CPU support.
avx2ops = []

[dependencies]
# Safe `&[u32] -> &[u8]` reinterpretation for the fused SHA sink, so the
# streaming hash path needs no `unsafe` (see src/v114.rs).
bytemuck = "1"
sha2 = "0.10"
sha3.workspace = true
salsa20 = "0.10"
xxhash-rust = { version = "0.8", features = ["xxh64"] }
siphasher = "1"
num-bigint = { workspace = true }
num-traits = { workspace = true }
# default-features = false drops the crate's default `openmp` feature (and the
# openmp-sys system dependency): the miner already parallelizes across nonces.
libsais-sys = { version = "0.2", default-features = false, optional = true }

# aarch64 only: sha2's ARMv8 crypto-extension backend (SHA256H/SHA256SU with
# runtime hwcap detect and soft fallback) sits behind the crate's `asm`
# feature, which pulls sha2-asm's cc-assembled .S — the ONE exception to the
# no-C-toolchain rule above, and only on aarch64. Without it every AstroBWTv3
# hash pays ~4,200 SOFTWARE sha256 compressions (the ~263–284 KB final digest
# of the SA output): measured 2.41 KH/s on a Snapdragon 8 Elite where hw SHA
# projects ~7–8 KH/s. x86 needs nothing — sha2 compiles its SHA-NI backend
# unconditionally there — and resolver-2 feature unification keeps x86/Windows
# builds byte-identical to before this section existed.
[target.'cfg(target_arch = "aarch64")'.dependencies]
sha2 = { version = "0.10", features = ["asm"] }

[build-dependencies]
cc = "1"

[dev-dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
hex = { workspace = true }
sha3.workspace = true
salsa20 = "0.10"

# The 2-way SHA-NI bench references the shani2-gated module; only build it when
# that feature is on so default `cargo test` / builds stay green.
[[example]]
name = "sha256_x2_bench"
required-features = ["shani2"]

[[example]]
name = "astrobwtv3_x2_bench"
required-features = ["v114", "shani2"]

[[example]]
name = "x2_mt"
required-features = ["v114", "shani2"]

# The frozen arm64 measurement harness. Needs shani2 for its 2way mode, which
# reaches astrobwtv3_x2 -- the path --sustained and --bench structurally cannot.
[[example]]
name = "arm_bench"
required-features = ["v114", "shani2"]
