name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.97.0

      - name: Test workspace
        run: cargo test --locked --workspace

      - name: Test v1.14 backend
        run: cargo test --locked -p dero-astrobwt --features v114

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck

      - name: Check shell scripts
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t scripts < <(git ls-files '*.sh')
          ((${#scripts[@]} == 0)) || bash -n "${scripts[@]}"
          ((${#scripts[@]} == 0)) || shellcheck --severity=error "${scripts[@]}"
