name: Release

# Builds the pure-Rust miner for Windows x64 + Linux x64/aarch64 (static musl) and
# publishes a GitHub Release with the archives + SHA256SUMS. Cross-compiles every
# target from one Linux runner via cargo-zigbuild. Plain `--release` (no PGO): the
# SHA-NI 2-way path is selected at runtime, so the binaries stay portable.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Tag to build and publish (e.g. v0.2.0)"
        required: true

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build & publish
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - name: Add cross targets
        run: rustup target add x86_64-pc-windows-gnu x86_64-unknown-linux-musl aarch64-unknown-linux-musl

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "v=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "v=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build all platforms + package
        env:
          VER: ${{ steps.ver.outputs.v }}
        run: |
          set -euo pipefail
          NAME="Dirtybird-Rust-Miner"
          BIN="dero-miner"
          DIST="dist"
          rm -rf "$DIST"; mkdir -p "$DIST"

          build() { # $1 = rust target triple
            cargo zigbuild --release -p "$BIN" --features v114 --target "$1" --bin "$BIN"
          }

          # ---- Linux static-musl tarballs (run on any Linux) ----
          for pair in "amd64:x86_64-unknown-linux-musl" "arm64:aarch64-unknown-linux-musl"; do
            arch="${pair%%:*}"; target="${pair#*:}"
            build "$target"
            stem="${NAME}-${arch}-${VER}"; d="$DIST/$stem"
            mkdir -p "$d"
            cp "target/$target/release/$BIN" "$d/$BIN"
            chmod +x "$d/$BIN"
            cp README.md LICENSE "$d/"
            tar -C "$DIST" --mode='u+rwx,go+rx' -czf "$DIST/$stem.tar.gz" "$stem"
            rm -rf "$d"
          done

          # ---- Windows x64 zip ----
          build x86_64-pc-windows-gnu
          stem="${NAME}-win64-${VER}"; wd="$DIST/$stem"
          mkdir -p "$wd"
          cp "target/x86_64-pc-windows-gnu/release/$BIN.exe" "$wd/"
          cp README.md LICENSE "$wd/"
          ( cd "$DIST" && zip -qr "$stem.zip" "$stem" )
          rm -rf "$wd"

          # ---- checksums ----
          ( cd "$DIST" && sha256sum *.zip *.tar.gz > SHA256SUMS.txt )
          echo "=== dist ==="; ls -1 "$DIST"

      - name: Verify checksums
        run: cd dist && sha256sum -c SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ steps.ver.outputs.v }}
        run: |
          set -euo pipefail
          ASSETS=(dist/*.zip dist/*.tar.gz dist/SHA256SUMS.txt)
          if gh release view "$VER" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$VER" "${ASSETS[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$VER" "${ASSETS[@]}" --repo "$GITHUB_REPOSITORY" \
              --title "Dirtybird Rust Miner $VER" --generate-notes
          fi
