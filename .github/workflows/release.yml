name: Release

# Builds the pure-Rust miner for Windows x64, Linux x64/aarch64 (static musl),
# Android aarch64 (bionic-native, the Termux artifact), and macOS aarch64
# (Apple Silicon, built natively on the arm64 macOS runner), plus a
# HiveOS/mmpOS farm package wrapping the Linux amd64 binary, and publishes a
# GitHub Release with the archives + SHA256SUMS. musl/mingw targets cross-
# compile via cargo-zigbuild; the android target links with the runner's NDK
# (zig has no bionic libc). Plain `--release` (no PGO): the SHA-NI 2-way path
# is selected at runtime, so the binaries stay portable.
#
# All aarch64 targets also need a C compiler for the TARGET (not just a
# linker): sha2's aarch64 hardware-SHA-256 backend is enabled via its `asm`
# feature, which drags in a cc-compiled .S that nothing on aarch64 calls but
# that must still build. zig cc covers musl; the NDK clang covers android;
# Xcode clang covers darwin.
#
# Split into verify → parallel builds → publish because the macOS binary can
# only be built on a macOS runner: artifacts hop between jobs via
# upload/download-artifact, and every build job ships its own checksum file so
# the publish job can prove the hop was lossless before it signs the combined
# SHA256SUMS.txt into the release.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify tag & test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.97.0

      - name: Verify signed tag and package version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VER="$GITHUB_REF_NAME"
          [[ "$VER" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          TAG_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$VER" --jq '.object.sha')"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$VER" --jq '.object.type')" = tag
          test "$(git rev-parse HEAD)" = \
            "$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$TAG_SHA" --jq '.object.sha')"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$TAG_SHA" --jq '.verification.verified')" = true
          PACKAGE_VERSION="$(cargo metadata --locked --no-deps --format-version 1 |
            jq -r '.packages[] | select(.name == "dero-miner") | .version')"
          test "$VER" = "v$PACKAGE_VERSION"
          if gh release view "$VER" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $VER already exists"
            exit 1
          fi

      - name: Test workspace
        run: |
          cargo test --locked --workspace
          cargo test --locked -p dero-astrobwt --features v114

  build-linux-windows:
    name: Build linux/windows/android
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.97.0
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.14.1
      - uses: taiki-e/install-action@3d7d7cd5ac7f994c1892ae0c06165095b9139094 # v2
        with:
          tool: cargo-zigbuild@0.23.0

      - name: Add cross targets
        run: rustup target add x86_64-pc-windows-gnu x86_64-unknown-linux-musl aarch64-unknown-linux-musl aarch64-linux-android

      - name: Resolve Android NDK toolchain
        run: |
          set -euo pipefail
          # ubuntu-latest sets ANDROID_NDK{,_HOME,_ROOT,_LATEST_HOME}; which
          # one is newest has moved between image generations, so prefer
          # _LATEST_HOME and fail loudly rather than silently building against
          # a stale NDK. Workflow-level `env:` is not shell-expanded, hence
          # GITHUB_ENV. API 24 = Android 7.0, Termux's own minimum (Rust std's
          # floor is 21).
          NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-${ANDROID_NDK_ROOT:-}}}"
          test -n "$NDK" && test -d "$NDK"
          BINDIR="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          CLANG="$BINDIR/aarch64-linux-android24-clang"
          test -x "$CLANG" && test -x "$BINDIR/llvm-ar"
          echo "NDK: $NDK"; cat "$NDK/source.properties"
          "$CLANG" --version | head -n1
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$CLANG" >> "$GITHUB_ENV"
          # A C compiler for the TARGET became necessary in v0.2.8: sha2's `asm`
          # feature (the aarch64 hardware SHA-256 backend) pulls in sha2-asm,
          # whose build.rs cc-compiles sha256_aarch64.S. That object is dead
          # code here -- sha2's aarch64 backend is Rust `asm!`, and only x86
          # calls into sha2-asm -- but it must still COMPILE or the build fails,
          # and without these the cc crate reaches for the host gcc and emits
          # x86 objects for an aarch64 link.
          echo "CC_aarch64_linux_android=$CLANG" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=$BINDIR/llvm-ar" >> "$GITHUB_ENV"

      - name: Resolve aarch64 disassembler
        run: |
          set -euo pipefail
          # verify-arm64-elf.sh asserts ARMv8 SHA-256 instructions in BOTH arm64
          # artifacts. ubuntu's objdump is x86-only and would silently report
          # zero matches for an arm64 binary, so use the toolchain's multi-arch
          # llvm-objdump. Keep byte-identical to ci.yml.
          rustup component add llvm-tools
          HOST="$(rustc -vV | sed -n 's/^host: //p')"
          OBJDUMP="$(rustc --print sysroot)/lib/rustlib/$HOST/bin/llvm-objdump"
          test -x "$OBJDUMP"
          "$OBJDUMP" --version | head -n2
          echo "OBJDUMP=$OBJDUMP" >> "$GITHUB_ENV"

      - name: Build all platforms + package
        env:
          VER: ${{ github.ref_name }}
          # arm64 (musl): the GENERIC-LINUX artifact since v0.2.7 — Termux is
          # served by the separate aarch64-linux-android tarball below (a musl
          # static-PIE dies under Termux's exec-through-linker64 path and musl
          # DNS cannot resolve on Android at all). Built as a static-PIE:
          # zig cc silently ignores clang's -static-pie (a no-op in zig
          # 0.14.1 -- exactly how rustc's own static-PIE request for musl
          # targets gets dropped) but honors plain -pie, and links musl
          # targets statically with rcrt1.o, so this yields ET_DYN with no
          # PT_INTERP. relocation-model=pic is the target default, pinned
          # because PIE links require PIC objects. The PT_TLS >= 0x40 gate
          # (src/main.rs bionic_tls_align + verify-arm64-elf.sh) is retained:
          # people do fetch this tarball onto phones by hand. Note: a
          # target-scoped RUSTFLAGS var REPLACES any global RUSTFLAGS for its
          # target; none is set today, but duplicate it here if one is added.
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_RUSTFLAGS: >-
            -C relocation-model=pic -C link-arg=-pie
          # android-arm64: bionic DYNAMIC PIE (PT_INTERP=/system/bin/linker64)
          # — the ABI Termux's exec path is built for; bionic resolves DNS via
          # netd instead of /etc/resolv.conf. 16 KB pages ship on Android 15+
          # devices: NDK r27+ defaults max-page-size to 16384, older NDKs to
          # 4096 — pin it explicitly so the artifact does not depend on the
          # runner image's NDK; verify-arm64-elf.sh asserts the result.
          CARGO_TARGET_AARCH64_LINUX_ANDROID_RUSTFLAGS: >-
            -C link-arg=-Wl,-z,max-page-size=16384
        run: |
          set -euo pipefail
          NAME="Dirtybird-Rust-Miner"
          BIN="dero-miner"
          DIST="dist"
          rm -rf "$DIST"; mkdir -p "$DIST"

          build() { # $1 = rust target triple
            case "$1" in
              # cargo-zigbuild has no bionic libc (zig ships glibc/musl/mingw
              # only), so the android target goes through plain cargo + the
              # NDK clang wrapper resolved into
              # CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER above.
              *-linux-android)
                cargo build --locked --release -p "$BIN" --features v114 --target "$1" --bin "$BIN" ;;
              *)
                cargo zigbuild --locked --release -p "$BIN" --features v114 --target "$1" --bin "$BIN" ;;
            esac
          }

          # ---- Linux tarballs ----
          # amd64/arm64: static-musl, generic Linux. android-arm64: bionic
          # dynamic PIE for Termux (the musl arm64 build cannot resolve DNS on
          # Android and does not survive linker64's exec path).
          for pair in "amd64:x86_64-unknown-linux-musl" \
                      "arm64:aarch64-unknown-linux-musl" \
                      "android-arm64:aarch64-linux-android"; do
            arch="${pair%%:*}"; target="${pair#*:}"
            build "$target"
            stem="${NAME}-${arch}-${VER}"; d="$DIST/$stem"
            mkdir -p "$d"
            cp "target/$target/release/$BIN" "$d/$BIN"
            chmod +x "$d/$BIN"
            cp README.md LICENSE "$d/"
            tar -C "$DIST" --mode='u+rwx,go+rx' -czf "$DIST/$stem.tar.gz" "$stem"
            rm -rf "$d"
          done

          # ---- HiveOS / mmpOS farm package ----
          # The Linux amd64 musl binary again (HiveOS and mmpOS images are
          # x86_64 Ubuntu), wrapped with the farm-agent hook scripts from
          # hive/. Lowercase stem and inner directory: the farm installers
          # derive the miner name from them, and the field convention
          # (tnn-miner, deroluna) is lowercase.
          stem="dirtybird-rust-miner-${VER}.hiveos_mmpos.amd64"
          d="$DIST/dirtybird-rust-miner"
          mkdir -p "$d"
          cp "target/x86_64-unknown-linux-musl/release/$BIN" "$d/$BIN"
          cp hive/h-manifest.conf hive/h-config.sh hive/h-run.sh \
            hive/h-stats.sh hive/mmp-stats.sh "$d/"
          chmod +x "$d/$BIN" "$d"/*.sh
          cp README.md LICENSE "$d/"
          tar -C "$DIST" --mode='u+rwx,go+rx' -czf "$DIST/$stem.tar.gz" \
            dirtybird-rust-miner
          rm -rf "$d"

          # ---- Windows x64 zip ----
          build x86_64-pc-windows-gnu
          stem="${NAME}-win64-${VER}"; wd="$DIST/$stem"
          mkdir -p "$wd"
          cp "target/x86_64-pc-windows-gnu/release/$BIN.exe" "$wd/"
          cp README.md LICENSE "$wd/"
          ( cd "$DIST" && zip -qr "$stem.zip" "$stem" )
          rm -rf "$wd"

          # ---- checksums (verified again by the publish job after the
          # artifact hop, then merged into the release SHA256SUMS.txt) ----
          ( cd "$DIST" && sha256sum *.zip *.tar.gz > SHA256SUMS.linux.txt )
          echo "=== dist ==="; ls -1 "$DIST"

      - name: Install qemu-user (musl arm64 smoke test only — qemu cannot exec bionic)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-user-static

      - name: Verify binaries and checksums
        run: |
          set -euo pipefail
          VER="$GITHUB_REF_NAME"
          cd dist
          sha256sum -c SHA256SUMS.linux.txt
          mkdir "$RUNNER_TEMP/rust-miner-smoke"
          tar -xzf "Dirtybird-Rust-Miner-amd64-$VER.tar.gz" \
            -C "$RUNNER_TEMP/rust-miner-smoke"
          BIN="$RUNNER_TEMP/rust-miner-smoke/Dirtybird-Rust-Miner-amd64-$VER/dero-miner"
          test "$("$BIN" --version)" = "dero-miner ${VER#v}"
          test "$("$BIN" --selftest)" = "AstroBWTv3 self-test: PASS"

          # ---- arm64 (musl, generic Linux): static-PIE policy + execution ----
          # The readelf asserts pin the static-PIE contract, the SHA-256
          # instruction assert pins the hardware hash backend (v0.2.8+), and the
          # qemu run proves the packaged binary actually starts (musl init, TLS).
          tar -xzf "Dirtybird-Rust-Miner-arm64-$VER.tar.gz" \
            -C "$RUNNER_TEMP/rust-miner-smoke"
          ARM="$RUNNER_TEMP/rust-miner-smoke/Dirtybird-Rust-Miner-arm64-$VER/dero-miner"
          ../scripts/verify-arm64-elf.sh "$ARM"
          test "$(qemu-aarch64-static "$ARM" --version)" = "dero-miner ${VER#v}"
          test "$(qemu-aarch64-static "$ARM" --selftest)" = "AstroBWTv3 self-test: PASS"

          # ---- android-arm64 (bionic, the Termux artifact): ELF policy ----
          # There is NO execution gate here and there cannot be one:
          # qemu-user cannot run a bionic binary (it would need
          # /system/bin/linker64 + /system/lib64) and an x86_64 runner cannot
          # boot an arm64 emulator. These ELF asserts plus the on-device exec
          # probe in scripts/termux-setup.sh are the whole safety net.
          tar -xzf "Dirtybird-Rust-Miner-android-arm64-$VER.tar.gz" \
            -C "$RUNNER_TEMP/rust-miner-smoke"
          AND="$RUNNER_TEMP/rust-miner-smoke/Dirtybird-Rust-Miner-android-arm64-$VER/dero-miner"
          ../scripts/verify-arm64-elf.sh "$AND" bionic

          # ---- HiveOS/mmpOS package: layout + the same amd64 binary ----
          # Same executable as the amd64 tarball smoke-tested above; assert
          # the farm hooks are present and the binary inside runs.
          tar -xzf "dirtybird-rust-miner-$VER.hiveos_mmpos.amd64.tar.gz" \
            -C "$RUNNER_TEMP/rust-miner-smoke"
          HIVE="$RUNNER_TEMP/rust-miner-smoke/dirtybird-rust-miner"
          for f in dero-miner h-manifest.conf h-config.sh h-run.sh h-stats.sh mmp-stats.sh; do
            test -f "$HIVE/$f"
          done
          test "$("$HIVE/dero-miner" --version)" = "dero-miner ${VER#v}"
          test "$("$HIVE/dero-miner" --selftest)" = "AstroBWTv3 self-test: PASS"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist-linux
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS.linux.txt
          if-no-files-found: error
          retention-days: 3

  test-windows:
    name: Test packaged win64
    needs: build-linux-windows
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist-linux
          path: dist

      - name: Run packaged Windows binary
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ver = $env:GITHUB_REF_NAME
          $root = Join-Path $env:RUNNER_TEMP "rust-miner-smoke"
          Expand-Archive -LiteralPath "dist/Dirtybird-Rust-Miner-win64-$ver.zip" -DestinationPath $root
          $exe = Join-Path $root "Dirtybird-Rust-Miner-win64-$ver/dero-miner.exe"
          $actual = & $exe --version
          if ($LASTEXITCODE -ne 0 -or $actual -ne "dero-miner $($ver.Substring(1))") {
            throw "Unexpected version output: $actual"
          }
          $actual = & $exe --selftest
          if ($LASTEXITCODE -ne 0 -or $actual -ne "AstroBWTv3 self-test: PASS") {
            throw "Unexpected self-test output: $actual"
          }

  build-macos:
    name: Build macos-arm64
    needs: verify
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.97.0

      - name: Build + package
        env:
          VER: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Native build: macos-latest runners are Apple Silicon, and sha2's
          # aarch64 `asm` feature cc-compiles its .S with the host Xcode clang.
          # Assert the arch rather than assume it — if GitHub ever points
          # macos-latest back at x86_64, fail here instead of shipping an
          # amd64 binary under an arm64 name.
          test "$(rustc -vV | sed -n 's/^host: //p')" = aarch64-apple-darwin
          cargo build --locked --release -p dero-miner --features v114 --bin dero-miner

          NAME="Dirtybird-Rust-Miner"
          VER_NUM="${VER#v}"
          test "$(target/release/dero-miner --version)" = "dero-miner $VER_NUM"
          test "$(target/release/dero-miner --selftest)" = "AstroBWTv3 self-test: PASS"

          DIST="dist"
          rm -rf "$DIST"; mkdir -p "$DIST"
          stem="${NAME}-macos-arm64-${VER}"; d="$DIST/$stem"
          mkdir -p "$d"
          cp target/release/dero-miner "$d/dero-miner"
          chmod +x "$d/dero-miner"
          cp README.md LICENSE "$d/"
          # bsdtar has no GNU --mode; the chmod above is what the archive
          # records.
          tar -C "$DIST" -czf "$DIST/$stem.tar.gz" "$stem"
          rm -rf "$d"
          mkdir "$RUNNER_TEMP/rust-miner-smoke"
          tar -xzf "$DIST/$stem.tar.gz" -C "$RUNNER_TEMP/rust-miner-smoke"
          test "$("$RUNNER_TEMP/rust-miner-smoke/$stem/dero-miner" --selftest)" = \
            "AstroBWTv3 self-test: PASS"
          ( cd "$DIST" && shasum -a 256 "$stem.tar.gz" > SHA256SUMS.macos.txt )
          ls -1 "$DIST"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist-macos
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS.macos.txt
          if-no-files-found: error
          retention-days: 3

  publish:
    name: Publish release
    needs: [build-linux-windows, test-windows, build-macos]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true

      - name: Merge and verify checksums
        run: |
          set -euo pipefail
          cd dist
          # Re-verify every file against the checksum its build job recorded:
          # a corrupt artifact hop must fail here, before anything is signed
          # into the release.
          sha256sum -c SHA256SUMS.linux.txt
          sha256sum -c SHA256SUMS.macos.txt
          cat SHA256SUMS.linux.txt SHA256SUMS.macos.txt | sort -k2 > SHA256SUMS.txt
          rm SHA256SUMS.linux.txt SHA256SUMS.macos.txt
          sha256sum -c SHA256SUMS.txt
          echo "=== release assets ==="; ls -1 .

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ASSETS=(dist/*.zip dist/*.tar.gz dist/SHA256SUMS.txt)
          gh release create "$VER" "${ASSETS[@]}" --repo "$GITHUB_REPOSITORY" \
            --verify-tag --title "Dirtybird Rust Miner $VER" --generate-notes
          test "$(gh release view "$VER" --repo "$GITHUB_REPOSITORY" \
            --json isImmutable --jq '.isImmutable')" = true
          for attempt in 1 2 3; do
            ok=true
            gh release verify "$VER" --repo "$GITHUB_REPOSITORY" || ok=false
            for asset in "${ASSETS[@]}"; do
              gh release verify-asset "$VER" "$asset" \
                --repo "$GITHUB_REPOSITORY" || ok=false
            done
            $ok && exit 0
            sleep 5
          done
          exit 1
